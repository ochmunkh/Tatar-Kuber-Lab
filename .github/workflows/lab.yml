name: TATAR-Kuber Lab
on:
  push:
  pull_request:
  workflow_dispatch:
  # Өдөр тутам. Хоёр repo-гийн аль нь ч хөдлөөгүй атлаа орчин хөдөлж болно:
  # go-version "stable" шинэ хувилбар руу шилжих, action шинэчлэгдэх г.м.
  # Engine-ийн CI нь engine-ийн push дээр, энэ workflow нь Lab-ийн push дээр
  # ажиллах тул ямар ч push байхгүй үеийг зөвхөн энэ cron хамгаална.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ochmunkh/Tatar-Kuber
          path: engine

      - uses: actions/setup-go@v5
        with:
          go-version: "stable" # patched stdlib (matches engine go.mod toolchain)

      - name: Build tatar-kuber (canonical registry embedded)
        run: |
          (cd engine && go build -o "$GITHUB_WORKSPACE/tatar-kuber" ./cmd/tatar-kuber)
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Run the full lab (doctor · scan · report ×3 · gate · verify-lab)
        run: ./run-lab.sh
