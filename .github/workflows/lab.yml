name: TATAR-Kuber Lab
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ochmunkh/Tatar-Kuber
          path: engine
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Build tatar-kuber
        run: (cd engine && go build -o "$GITHUB_WORKSPACE/tatar-kuber" ./cmd/tatar-kuber)
      - name: Normalize offline raw + verify baseline
        run: |
          ./tatar-kuber scan --raw-dir raw --cluster tatar-kuber-lab \
            --registry engine/schema/canonical-controls.yaml -o normalized
          mv -f normalized/scan-result.json normalized/tatar-findings.json
          ./tatar-kuber verify-lab \
            --input normalized/tatar-findings.json \
            --expected expected/expected-findings.json
